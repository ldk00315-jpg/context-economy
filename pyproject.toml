[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-economy"
version = "0.1.0"
description = "Measured, lossless-first context preparation and exact local queries"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
test = ["pytest>=8"]

[project.scripts]
context-economy = "context_economy.cli:main"

[tool.setuptools.packages.find]
include = ["context_economy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
